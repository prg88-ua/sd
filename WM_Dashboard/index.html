<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Monitorización - CENTRAL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación para el color VERDE PARPADEANDO que pide la práctica */
        @keyframes blink { 50% { opacity: 0.5; } }
        .blink-green { animation: blink 1.5s linear infinite; background-color: #22c55e; }
        /* Terminal de solo lectura: las líneas largas se ajustan sin ensanchar el panel. */
        .log-terminal { background: #080d16; color: #cbd5e1; font: 13px/1.7 Consolas, "Courier New", monospace;
            height: 320px; max-height: 55vh; overflow-y: auto; padding: 16px; overflow-wrap: anywhere; }
        .log-entry { white-space: pre-wrap; }
        .log-time { color: #718096; }
        .log-level { color: #67e8f9; }
        .log-warning .log-level, .log-warning .log-message { color: #fcd34d; }
        .log-error .log-level, .log-error .log-message { color: #fca5a5; }
        .log-notice { color: #94a3b8; font-style: italic; }
        .terminal-heading { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
            padding: 14px 16px; align-items: center; background: #111827; border-bottom: 1px solid #374151; }
        .terminal-button { border: 1px solid #4b5563; border-radius: 5px; padding: 4px 10px; font-size: 12px; }
        .terminal-button:hover { background: #374151; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Cabecera -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-blue-400">Panel de Control: Water Management</h1>
        </div>
        <div class="flex gap-3 mb-6">
            <button
                onclick="stationAction('ALL', 'start')"
                class="bg-blue-600 px-4 py-2 rounded"
            >
                Regar disponibles
            </button>

            <button
                onclick="stationAction('ALL', 'block')"
                class="bg-orange-600 px-4 py-2 rounded"
            >
                Bloquear todas
            </button>

            <button
                onclick="stationAction('ALL', 'activate')"
                class="bg-green-600 px-4 py-2 rounded"
            >
                Activar todas
            </button>
        </div>
        <!-- Tarjetas de Resumen -->
        <div class="grid grid-cols-5 gap-4 mb-6" id="summary-cards">
            <!-- JS inyectará aquí los contadores -->
        </div>

        <!-- Tabla principal -->
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-700 text-gray-300">
                    <tr>
                        <th class="p-4">ID Estación</th>
                        <th class="p-4">Ubicación</th>
                        <th class="p-4 text-center">Caudal (L/min)</th>
                        <th class="p-4 text-center">Volumen Acumulado</th>
                        <th class="p-4 text-center">Operario</th>
                        <th class="p-4 text-center">Estado</th>
                        <th class="p-4 text-center">Acciones Central</th>
                    </tr>
                </thead>
                <tbody id="stations-table-body">
                    <tr>
                        <td colspan="7" class="p-4 text-center text-gray-400">Esperando conexión con CENTRAL...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- Vista de los eventos de Central; no ejecuta comandos del sistema. -->
        <section class="mt-8 rounded-lg overflow-hidden border border-gray-700 shadow-lg" aria-labelledby="logs-title">
            <div class="terminal-heading">
                <div>
                    <h2 id="logs-title" class="font-mono font-bold text-gray-100">&gt;_ Logs de Central</h2>
                    <p class="text-xs text-gray-400 mt-1">Solo lectura · últimos 500 eventos · hora de Central</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <span id="logs-status" class="text-xs text-gray-400" role="status">Conectando...</span>
                    <label class="text-xs text-gray-300 flex items-center gap-1">
                        <input id="logs-follow" type="checkbox" checked> Seguir últimos
                    </label>
                    <button id="logs-pause" class="terminal-button" type="button" aria-pressed="false">Pausar</button>
                    <button id="logs-clear" class="terminal-button" type="button">Limpiar vista</button>
                </div>
            </div>
            <div id="logs-output" class="log-terminal" role="log" aria-label="Eventos de Central" aria-live="off" tabindex="0">
                <div class="log-notice" id="logs-empty">Esperando actividad de Central...</div>
            </div>
        </section>
    </div>

    <script>
        // Función para ejecutar acciones individuales sobre una estación
        async function stationAction(wsId, action) {
            try {
                const options = { method: 'POST' };

                if (action === 'start') {
                    const answer = prompt('Duración del riego en segundos:', '10');

                    if (answer === null) {
                        return;
                    }

                    const duration = Number(answer);

                    if (!Number.isInteger(duration) || duration < 1 || duration > 3600) {
                        alert('Introduce un número entero entre 1 y 3600.');
                        return;
                    }

                    options.headers = { 'Content-Type': 'application/json' };
                    options.body = JSON.stringify({ duration });
                }

                const response = await fetch(
                    `/api/stations/${encodeURIComponent(wsId)}/${action}`,
                    options
                );

                const result = await response.json();

                if (!response.ok) {
                    alert(result.error || 'No se pudo tramitar la acción.');
                }

                await fetchStations();
            } catch (error) {
                alert('No se pudo contactar con CENTRAL.');
                console.error(error);
            }
        }

        async function fetchStations() {
            try {
                const response = await fetch('/api/stations');
                const stations = await response.json();
                
                const tbody = document.getElementById('stations-table-body');
                tbody.innerHTML = ''; 

                let counts = { AVAILABLE: 0, WATERING: 0, LEAK: 0, OUT_OF_SERVICE: 0, OFFLINE: 0 };

                stations.forEach(ws => {
                    if (counts[ws.status] !== undefined) counts[ws.status]++;

                    let bgClass = "bg-gray-500 text-white"; 
                    let legend = "Desconectada";

                    if (ws.status === 'AVAILABLE') {
                        bgClass = "bg-green-500 text-white";
                        legend = "Disponible";
                    } else if (ws.status === 'WATERING') {
                        bgClass = "blink-green text-white";
                        legend = "Regando";
                    } else if (ws.status === 'LEAK') {
                        bgClass = "bg-red-600 text-white";
                        legend = "Fuga";
                    } else if (ws.status === 'OUT_OF_SERVICE') {
                        bgClass = "bg-orange-500 text-white";
                        legend = "Fuera de Servicio";
                    }

                    const isWatering = ws.status === 'WATERING';
                    const flow = isWatering ? `<span class="text-cyan-300 font-bold">${parseFloat(ws.current_flow).toFixed(1)}</span>` : '<span class="text-gray-600">-</span>';
                    const vol = `<span class="text-blue-300 font-bold">${parseFloat(ws.accumulated_volume || 0).toFixed(1)} L</span>`;
                    const operator = isWatering ? `<span class="text-yellow-300 font-bold">${ws.current_operator}</span>` : '<span class="text-gray-600">-</span>';

                    // LÓGICA DE BOTONES SEGÚN ESTADO DE CONEXIÓN
                    let actionButtons = '<span class="text-gray-600 font-bold">-</span>';

                    if (ws.status === 'AVAILABLE') {
                        // Conectada y libre: puede regar o bloquearse
                        actionButtons = `
                            <button onclick="stationAction('${ws.id}', 'start')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-2 py-1 rounded text-xs mr-2 transition">
                                💧 Regar
                            </button>
                            <button onclick="stationAction('${ws.id}', 'block')" class="bg-orange-600 hover:bg-orange-700 text-white font-semibold px-2 py-1 rounded text-xs transition">
                                ⛔ Bloquear
                            </button>
                        `;
                    } else if (ws.status === 'WATERING') {
                        // En riego: solo botón para parar / bloquear de emergencia
                        actionButtons = `
                            <button onclick="stationAction('${ws.id}', 'block')" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-2 py-1 rounded text-xs transition">
                                ⛔ Parar Riego
                            </button>
                        `;
                    } else if (ws.status === 'OUT_OF_SERVICE') {
                        // Conectada pero bloqueada: botón para reactivarla
                        actionButtons = `
                            <button onclick="stationAction('${ws.id}', 'activate')" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-3 py-1 rounded text-xs transition">
                                ✅ Activar
                            </button>
                        `;
                    } else if (ws.status === 'LEAK') {
                        actionButtons = `<span class="text-red-400 text-xs font-semibold">⚠️ Avería detectada</span>`;
                    }
                    // Si ws.status === 'OFFLINE' se queda con el '-'

                    const row = `
                        <tr class="border-b border-gray-700 hover:bg-gray-750 transition-colors">
                            <td class="p-4 font-mono font-bold text-gray-200">${ws.id}</td>
                            <td class="p-4 text-gray-300">${ws.location}</td>
                            <td class="p-4 font-mono text-center">${flow}</td>
                            <td class="p-4 font-mono text-center">${vol}</td>
                            <td class="p-4 font-mono text-center">${operator}</td>
                            <td class="p-4 text-center">
                                <span class="${bgClass} px-3 py-1 rounded-full font-bold text-xs uppercase tracking-wide">
                                    ${legend}
                                </span>
                            </td>
                            <td class="p-4 text-center whitespace-nowrap">
                                ${actionButtons}
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                // Tarjetas resumen
                document.getElementById('summary-cards').innerHTML = `
                    <div class="bg-gray-800 p-4 rounded-lg text-center border-t-4 border-green-500 shadow">
                        <div class="text-4xl font-black text-green-400">${counts.AVAILABLE}</div>
                        <div class="text-xs text-gray-400 uppercase font-bold mt-1">Disponibles</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-lg text-center border-t-4 border-green-400 shadow">
                        <div class="text-4xl font-black text-white">${counts.WATERING}</div>
                        <div class="text-xs text-gray-400 uppercase font-bold mt-1">Regando</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-lg text-center border-t-4 border-red-500 shadow">
                        <div class="text-4xl font-black text-red-500">${counts.LEAK}</div>
                        <div class="text-xs text-gray-400 uppercase font-bold mt-1">Fugas</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-lg text-center border-t-4 border-orange-500 shadow">
                        <div class="text-4xl font-black text-orange-400">${counts.OUT_OF_SERVICE}</div>
                        <div class="text-xs text-gray-400 uppercase font-bold mt-1">Bloqueadas</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-lg text-center border-t-4 border-gray-500 shadow">
                        <div class="text-4xl font-black text-gray-500">${counts.OFFLINE}</div>
                        <div class="text-xs text-gray-400 uppercase font-bold mt-1">Desconectadas</div>
                    </div>
                `;

            } catch (error) {
                console.error("Error conectando con la Central:", error);
            }
        }

        const logsOutput = document.getElementById('logs-output');
        const logsStatus = document.getElementById('logs-status');
        const logsFollow = document.getElementById('logs-follow');
        const logsPause = document.getElementById('logs-pause');
        let logsCursor = 0;
        let logsSession = '';
        let logsPaused = false;
        let logsRequestVersion = 0;

        function setLogsStatus(text, connected = false) {
            logsStatus.textContent = text;
            logsStatus.className = connected ? 'text-xs text-green-400' : 'text-xs text-gray-400';
        }

        function appendLogNotice(message) {
            const line = document.createElement('div');
            line.className = 'log-entry log-notice';
            line.textContent = message;
            logsOutput.appendChild(line);
        }

        function appendLogEntry(entry) {
            const line = document.createElement('div');
            const level = ['INFO', 'WARNING', 'ERROR'].includes(entry.level) ? entry.level : 'INFO';
            line.className = `log-entry log-${level.toLowerCase()}`;
            const timestamp = document.createElement('span');
            timestamp.className = 'log-time';
            timestamp.textContent = `[${entry.time.replace('T', ' ')}] `;
            const severity = document.createElement('span');
            severity.className = 'log-level';
            severity.textContent = `${level.padEnd(7)} `;
            const message = document.createElement('span');
            message.className = 'log-message';
            // Los mensajes pueden contener datos externos: mostrarlos como texto
            // impide que un log se interprete como HTML o ejecute JavaScript.
            message.textContent = entry.message;
            line.append(timestamp, severity, message);
            logsOutput.appendChild(line);
        }

        function trimLogsView() {
            while (logsOutput.childElementCount > 500) {
                logsOutput.firstElementChild.remove();
            }
            if (logsFollow.checked) { logsOutput.scrollTop = logsOutput.scrollHeight; }
        }

        logsPause.addEventListener('click', () => {
            logsPaused = !logsPaused;
            // Invalidar una petición ya en vuelo hace que la pausa sea inmediata.
            logsRequestVersion++;
            logsPause.textContent = logsPaused ? 'Reanudar' : 'Pausar';
            logsPause.setAttribute('aria-pressed', String(logsPaused));
            setLogsStatus(logsPaused ? 'En pausa' : 'Conectando...');
        });

        document.getElementById('logs-clear').addEventListener('click', () => {
            logsOutput.replaceChildren();
            appendLogNotice('Vista limpia. Los nuevos eventos aparecerán aquí.');
            // No reiniciar el cursor: limpiar la vista no debe volver a traer
            // todo el historial ni borrar los logs de otros navegadores.
        });

        logsFollow.addEventListener('change', trimLogsView);

        async function fetchLogs() {
            if (logsPaused) { setTimeout(fetchLogs, 1000); return; }
            const requestVersion = logsRequestVersion;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);
            try {
                const params = new URLSearchParams({ after: String(logsCursor), session: logsSession });
                const response = await fetch(`/api/logs?${params}`, { cache: 'no-store', signal: controller.signal });
                if (!response.ok) { throw new Error('No se pudieron leer los logs'); }
                const result = await response.json();
                if (logsPaused || requestVersion !== logsRequestVersion) { return; }
                if (result.reset) {
                    logsOutput.replaceChildren();
                    appendLogNotice('Central se ha reiniciado. Mostrando los eventos de la nueva sesión.');
                }
                if (result.truncated) {
                    appendLogNotice('Se muestran los últimos eventos disponibles; algunos anteriores ya no se conservan.');
                }
                if (result.entries.length) {
                    document.getElementById('logs-empty')?.remove();
                    result.entries.forEach(appendLogEntry);
                }
                logsCursor = result.last_id;
                logsSession = result.session;
                trimLogsView();
                setLogsStatus('En directo', true);
            } catch (error) {
                if (!logsPaused && requestVersion === logsRequestVersion) {
                    setLogsStatus('Sin conexión · reintentando...');
                }
            } finally {
                clearTimeout(timeout);
                // Programar la siguiente lectura al terminar evita acumular
                // peticiones si AWS tarda en responder o se pierde la conexión.
                setTimeout(fetchLogs, 1000);
            }
        }

        fetchLogs();
        setInterval(fetchStations, 1000);
        fetchStations(); 
    </script>
</body>
</html>
